services:
  jarviz:
    build: .
    image: jarviz-backend:dev
    container_name: jarviz-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    # The image's default JARVIZ_DATA_DIR is /tmp/jarviz-data (chosen for
    # HF Spaces, which has no persistent volume). For compose we DO persist:
    # point the data dir at the mounted volume so devices.json survives
    # `docker compose down`/recreate. `environment` overrides `env_file`.
    environment:
      - JARVIZ_DATA_DIR=/data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
