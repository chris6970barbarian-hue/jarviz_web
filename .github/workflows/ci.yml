name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # libopus -> server.audio loads it via ctypes (Linux finds libopus.so.0
      # on the default loader path, so no LD_LIBRARY_PATH dance needed).
      # ffmpeg  -> the Edge-TTS resilience tests spawn it (else they skip).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0 ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -o faulthandler_timeout=60 -p no:cacheprovider -q

  audit:
    name: pip-audit (deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Resolves + audits the pinned PRODUCTION deps (requirements.txt). This
      # also catches phantom pins — a non-existent version (like the old
      # requests==2.33.1) fails resolution here. Advisory for now
      # (continue-on-error) so a transitive CVE or resolver hiccup surfaces in
      # the logs without blocking merges; flip to false to make it a hard gate.
      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc
